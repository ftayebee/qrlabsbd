# Production-oriented stack. Copy .env.docker.example to .env.docker and fill
# every value before `docker compose up`; required secrets have no defaults.
#
#   docker compose --env-file .env.docker up -d --build
#
# MySQL and Redis are only reachable on the internal network.

x-api-env: &api-env
  env_file: backend/.env.production
  environment:
    DB_HOST: mysql
    DB_DATABASE: ${MYSQL_DATABASE:-qrio}
    DB_USERNAME: ${MYSQL_USER:-qrio}
    DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/fastcgi_laravel.conf:/etc/nginx/fastcgi_laravel.conf:ro
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, internal]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL}
        NUXT_PUBLIC_SHORT_DOMAIN: ${SHORT_DOMAIN:-${APP_PUBLIC_URL}}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_URL: ${APP_PUBLIC_URL}
      NUXT_PUBLIC_SHORT_DOMAIN: ${SHORT_DOMAIN:-${APP_PUBLIC_URL}}
      # SSR reaches Laravel through nginx's internal, unpublished listener.
      NUXT_API_INTERNAL_URL: http://nginx:8080
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    <<: *api-env
    volumes:
      - api-storage:/var/www/html/storage/app
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    <<: *api-env
    command: ["php", "artisan", "queue:work", "redis", "--queue=billing,analytics,default", "--sleep=1", "--tries=5", "--max-time=3600"]
    volumes:
      - api-storage:/var/www/html/storage/app
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    <<: *api-env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [internal]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qrio}
      MYSQL_USER: ${MYSQL_USER:-qrio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

volumes:
  mysql-data:
  redis-data:
  api-storage:

networks:
  edge:
  internal:
    internal: true
