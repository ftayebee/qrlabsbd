# Production-oriented stack. It can deploy from this file alone: images build from
# the public GitHub repository and missing secrets are generated on first boot.
#
#   docker compose up -d --build
#
# To build from a checkout and configure the stack, copy .env.docker.example to .env.
# MySQL and Redis are only reachable on the internal network.

x-api: &api
  image: qrio-api
  build:
    context: ${BUILD_CONTEXT:-https://github.com/ftayebee/qrlabsbd.git#main}
    dockerfile: docker/backend/Dockerfile
  restart: unless-stopped
  environment:
    APP_NAME: ${APP_NAME:-Qrio}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${APP_PUBLIC_URL:-http://localhost}
    FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost}
    QRIO_SHORT_DOMAIN: ${SHORT_DOMAIN:-${APP_PUBLIC_URL:-http://localhost}}
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_DATABASE: ${MYSQL_DATABASE:-qrio}
    DB_USERNAME: ${MYSQL_USER:-qrio}
    REDIS_HOST: redis
    REDIS_CLIENT: phpredis
    CACHE_STORE: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    # Key-only entries are passed through when set and left unset otherwise.
    APP_KEY:
    MYSQL_PASSWORD:
    REDIS_PASSWORD:
    ADMIN_EMAIL:
    ADMIN_PASSWORD:
    MAIL_MAILER:
    MAIL_SCHEME:
    MAIL_HOST:
    MAIL_PORT:
    MAIL_USERNAME:
    MAIL_PASSWORD:
    MAIL_FROM_ADDRESS:
    MAIL_FROM_NAME:
    QRIO_BRAND_NAME:
    QRIO_SUPPORT_EMAIL:
    QRIO_FILES_DISK:
    AWS_ACCESS_KEY_ID:
    AWS_SECRET_ACCESS_KEY:
    AWS_DEFAULT_REGION:
    AWS_BUCKET:
    AWS_ENDPOINT:
    STRIPE_SECRET:
    STRIPE_WEBHOOK_SECRET:
    BILLING_CURRENCY:
    ANALYTICS_COUNTRY_HEADER:
    ANALYTICS_REGION_HEADER:
  volumes:
    - api-storage:/var/www/html/storage/app
    - qrio-secrets:/var/lib/qrio-secrets

services:
  nginx:
    build:
      context: ${BUILD_CONTEXT:-https://github.com/ftayebee/qrlabsbd.git#main}
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api: { condition: service_healthy }
      frontend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, internal]

  frontend:
    build:
      context: ${BUILD_CONTEXT:-https://github.com/ftayebee/qrlabsbd.git#main}
      dockerfile: docker/frontend/Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${APP_PUBLIC_URL:-http://localhost}
        NUXT_PUBLIC_SHORT_DOMAIN: ${SHORT_DOMAIN:-${APP_PUBLIC_URL:-http://localhost}}
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_URL: ${APP_PUBLIC_URL:-http://localhost}
      NUXT_PUBLIC_SHORT_DOMAIN: ${SHORT_DOMAIN:-${APP_PUBLIC_URL:-http://localhost}}
      # SSR reaches Laravel through nginx's internal, unpublished listener.
      NUXT_API_INTERNAL_URL: http://nginx:8080
    networks: [internal]

  # Writes the secrets the other services read, then exits.
  secrets:
    <<: *api
    restart: "no"
    command: ["true"]
    healthcheck: { disable: true }
    network_mode: none

  # Runs migrations on every deploy. Seeding happens once, because re-seeding
  # would reset permissions edited on the built-in roles.
  migrate:
    <<: *api
    restart: "no"
    command:
      - sh
      - -c
      - >-
        php artisan migrate --force &&
        if [ ! -f /var/lib/qrio-secrets/.seeded ]; then
        php artisan db:seed --force && touch /var/lib/qrio-secrets/.seeded;
        fi
    healthcheck: { disable: true }
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  api:
    <<: *api
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal, egress]

  queue:
    <<: *api
    command: ["php", "artisan", "queue:work", "redis", "--queue=billing,analytics,default", "--sleep=1", "--tries=5", "--max-time=3600"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal, egress]

  scheduler:
    <<: *api
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [internal, egress]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qrio}
      MYSQL_USER: ${MYSQL_USER:-qrio}
      MYSQL_PASSWORD_FILE: /var/lib/qrio-secrets/MYSQL_PASSWORD
      # The app only uses MYSQL_USER; the root password is printed once in the logs.
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - qrio-secrets:/var/lib/qrio-secrets:ro
    depends_on:
      secrets: { condition: service_completed_successfully }
    healthcheck:
      # Answers once setup finishes: the setup server doesn't listen on TCP.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$(cat /var/lib/qrio-secrets/REDIS_PASSWORD)"
    volumes:
      - redis-data:/data
      - qrio-secrets:/var/lib/qrio-secrets:ro
    depends_on:
      secrets: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /var/lib/qrio-secrets/REDIS_PASSWORD)\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

volumes:
  mysql-data:
  redis-data:
  api-storage:
  qrio-secrets:

networks:
  edge:
  # Outbound access for Stripe, mail and S3. Nothing is published on it.
  egress:
  internal:
    internal: true
