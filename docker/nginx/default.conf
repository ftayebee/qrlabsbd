# Single public entry point. Laravel serves the API, Sanctum, dynamic
# redirects (/r) and hosted files (/f); everything else is the Nuxt app.
# TLS is expected to terminate here (see docs/DEPLOYMENT.md) or at a load
# balancer in front of it.

limit_req_zone $binary_remote_addr zone=scans:20m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;

upstream nuxt { server frontend:3000; keepalive 32; }

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    client_max_body_size 60m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Enable once TLS is in place:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Dynamic QR redirects: hot path, aggressive per-IP flood protection.
    location ~ ^/r/[A-Za-z0-9]{4,16}$ {
        limit_req zone=scans burst=60 nodelay;
        include /etc/nginx/fastcgi_laravel.conf;
        # Overwrite any client-supplied value so Laravel (which trusts this proxy) sees the real address.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location ~ ^/(api|sanctum|f)/ {
        limit_req zone=api burst=80 nodelay;
        include /etc/nginx/fastcgi_laravel.conf;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location = /up {
        include /etc/nginx/fastcgi_laravel.conf;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    location /_nuxt/ {
        proxy_pass http://nuxt;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://nuxt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Internal-only listener (not published) used by Nuxt SSR to reach Laravel
# over HTTP. It trusts X-Forwarded-For because only the Nuxt container can reach it.
server {
    listen 8080;
    server_name _;
    client_max_body_size 60m;
    server_tokens off;

    location / {
        include /etc/nginx/fastcgi_laravel.conf;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    }
}
